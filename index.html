<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بطاقة تعريف | محمد جلال محمد بديه</title>
  <meta name="description" content="صفحة تعريف وتواصل لاسترجاع البطاقة أو أي غرض مفقود يخص محمد جلال محمد بديه.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="profile-card">
      <div class="top">
        <div class="photo-wrap">
          <!-- ضع صورتك هنا باسم profile.jpg -->
          <img src="profile.jpg" alt="صورة محمد" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
          <div class="photo-placeholder">صورة<br>محمد</div>
        </div>
        <div class="identity">
          <span class="eyebrow">بطاقة تعريف شخصية</span>
          <h1>محمد جلال محمد بديه</h1>
          <p class="school">الثانوية البيحاني النموذجية</p>
        </div>
      </div>

      <div class="info-grid">
        <div class="info"><span>🎂 العمر</span><strong id="age">—</strong></div>
        <div class="info"><span>📅 تاريخ الميلاد</span><strong>4 فبراير 2010</strong></div>
        <div class="info"><span>📚 الشعبة</span><strong>1</strong></div>
        <div class="info"><span>📍 السكن</span><strong>المعلا، عدن</strong></div>
      </div>

      <div class="contact">
        <h2>هل وجدت هذه البطاقة أو شيئًا يخصني؟</h2>
        <p>أرجوك ساعدني في إعادته إليّ، واتقِ الله في الأمانة، وجزاك الله خيرًا.</p>
        <a class="whatsapp" id="whatsapp" href="#" rel="noopener">تواصل معي عبر واتساب</a>
      </div>

      <footer>
        <span>آخر تحديث تلقائي للعمر</span>
        <span id="year"></span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
